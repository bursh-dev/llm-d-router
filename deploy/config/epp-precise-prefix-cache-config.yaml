# Sample EPP configuration with the precise-prefix-cache scorer.
apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig
plugins:
  - type: token-producer
    parameters:
      modelName: hf-repo/model-name           # set to the model used in the vLLM deployment
      vllm:
        url: http://localhost:8000
  - type: endpoint-notification-source
  - type: metrics-data-source
  - type: core-metrics-extractor
    parameters:
      # engineConfigs replaces an engine's spec wholesale, so the standard vLLM
      # specs are repeated alongside customMetrics for the preemption scorer.
      engineConfigs:
        - name: vllm
          queuedRequestsSpec: vllm:num_requests_waiting
          runningRequestsSpec: vllm:num_requests_running
          kvUsageSpec: vllm:kv_cache_usage_perc
          loraSpec: vllm:lora_requests_info
          cacheInfoSpec: vllm:cache_config_info
          customMetrics:
            - attributeKey: preemptions-total
              metricSpec: vllm:num_preemptions_total
  - type: single-profile-handler
  - type: decode-filter
  - type: precise-prefix-cache-scorer
    parameters:
      tokenProcessorConfig:
        blockSize: 64
      indexerConfig:
        kvBlockIndexConfig:
          enableMetrics: true         # enable kv-block index metrics (prometheus)
  - type: kv-cache-utilization-scorer
  - type: queue-scorer
  - type: preemption-scorer
    parameters:
      attributeKey: preemptions-total
      kvGate: 0.7
      floorMin: 0.5
      deepFloor: 0.1
      effectDurationMs: 300
      maxEscalations: 2
  - type: max-score-picker
dataLayer:
  sources:
    - pluginRef: metrics-data-source
      extractors:
        - pluginRef: core-metrics-extractor
    - pluginRef: endpoint-notification-source
      extractors:
        - pluginRef: precise-prefix-cache-scorer
schedulingProfiles:
  - name: default
    plugins:
      - pluginRef: decode-filter
      - pluginRef: precise-prefix-cache-scorer
        weight: 2.0
      - pluginRef: kv-cache-utilization-scorer
        weight: 1.0
      - pluginRef: queue-scorer
        weight: 1.0
      - pluginRef: preemption-scorer
        weight: 0.5
      - pluginRef: max-score-picker
